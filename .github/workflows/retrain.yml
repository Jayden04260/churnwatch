name: Retrain

# Manually triggered only - never on push. This is the "semi-automated"
# boundary for this project: drift detection + alerting run fully
# automatically (see drift_check.py's EventBridge schedule), but retraining
# and promotion are a deliberate human decision to kick off, not something
# a drift alert triggers on its own.
on:
  workflow_dispatch: {}

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain and evaluate
        run: python retrain.py

      # TODO once AWS deploy credentials exist for this project: if
      # retrain.py promoted a new model version, redeploy the API Lambda
      # (aws lambda update-function-code) so it actually picks up the new
      # model - same step as the CI/CD workflow's own deploy job once that
      # exists.
